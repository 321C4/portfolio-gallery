<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>First Citadel</title>
    <link rel="icon" sizes="192x192" href="../img/si-icon.png">
    <script src="../js/aframe.dev.js"></script>
     <script src="//cdn.rawgit.com/donmccurdy/aframe-extras/v1.16.0/dist/aframe-extras.min.js"></script>
</head>SSS
<body>

  <a-scene fog="type: exponential; density: 0; color: #000000; far: 10; near: 2">


  <a-sky color="#EBC0A5"></a-sky>

 <a-entity camera position="6 0.65 7" wasd-controls="acceleration: 50" look-controls></a-entity>

  <a-entity light="type: point; intensity: 0.2; color: #DECCC1"
          position="0 150 0"></a-entity>

  <a-entity light="type: point; intensity: 1; color: #AC5E66"
          position="-150 -100 50"></a-entity>

  <a-entity light="type: ambient; intensity: 0.8; color: #EBE7D7"
          position="200 -130 -25"></a-entity>

<!-- WATER LEVELS -->
<a-entity rotation="90 0 0" position="0 -0.25 0" scale="4.2 4.2" geometry="primitive: plane" material="color: #5B9BB7; side: double; opacity: 0.7">
</a-entity>

<a-entity rotation="90 0 0" position="0 -0.75 0" scale="6 6" geometry="primitive: plane" material="color: #5B9BB7; side: double; opacity: 0.75">
</a-entity>

<a-entity rotation="90 0 0" position="0 -1.4 0" scale="7 7" geometry="primitive: plane" material="color: #5B9BB7; side: double; opacity: 0.8">
</a-entity>

<a-entity rotation="90 0 0" position="0 -12 0" scale="100 100" geometry="primitive: plane" material="color: #5B9BB7; side: double; opacity: 0.8">
</a-entity>

<!-- CANALS -->

<a-entity rotation="0 0 0"><a-ocean scale="0.02 0.11 0.08" position="0 0.006 1.8" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>
<a-entity rotation="18 0 0"><a-ocean scale="0.02 0.1 0.08" position="0 0.75 2.73" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>

<a-entity rotation="0 90 0"><a-ocean scale="0.02 0.11 0.08" position="0 0.006 1.8" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>
<a-entity rotation="18 90 0"><a-ocean scale="0.02 0.1 0.08" position="0 0.75 2.73" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>

<a-entity rotation="0 180 0"><a-ocean scale="0.02 0.11 0.08" position="0 0.006 1.8" density="10" opacity="0.3" speed="0.5"></a-ocean>

<a-entity rotation="18 180 0"><a-ocean scale="0.02 0.1 0.08" position="0 0.75 2.73" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>

<a-entity rotation="0 270 0"><a-ocean scale="0.02 0.11 0.08" position="0 0.006 1.8" density="10" opacity="0.3" speed="0.5"></a-ocean>

<!-- WATERFALLS -->

<a-entity  rotation="90 0 0"><a-ocean scale="0.02 0.1 0.06" position="0 3.31 0.78" density="10" opacity="0.3" speed="0.5"></a-ocean>
</a-entity>

<a-entity rotation="90 90 0"><a-ocean scale="0.02 0.1 0.06" position="0 3.31 0.78" density="10" opacity="0.3" speed="0.5"></a-ocean>
