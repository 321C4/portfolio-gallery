<!DOCTYPE html>
<!--The head tag encloses links to any scripts you are using, scene title, and metadata such as favicon-->
   <head>
    <meta charset="utf-8">
     <title>EJL Portfolio</title>
    <script src="../js/aframe.min.js"></script>
    <link rel="icon" sizes="192x192" href="https://aframe.io/images/aframe-logo-192.png">
   </head>
  <body>
    <a-scene>
    	<a-assets>
    		<a-asset-item id="galleries" src="../models/galleries4.dae"></a-asset-item>
    	</a-assets>

    <a-sky color="#AAA"></a-sky>

    <a-camera position="0 0 0"></a-camera>

<!--LIGHTS-->

<a-entity id="dome-light" light="type: point; color: #FFF; intensity: 0.2" position="0 1 -5"></a-entity>
<a-light id="gallery-light" type="directional" intensity="0.5" position="0 1 -14" rotation="90 0 0">
</a-light>
<a-light id="atrium-light" type="point" intensity="0.5" position="0 1 -55">
</a-light>

<!--MODELS-->
      <a-collada-model src="#galleries" scale="2 2 2" position="0 0 0"></a-collada-model>
    </a-scene>
  </body>
</html>
